<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ServiceLink Morocco</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
        }

        /* Main App Container */
        .app-container {
            max-width: 500px;
            width: 100%;
            min-height: 100vh;
            background: white;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
        }

        /* ==================== ONBOARDING SCREENS ==================== */
        .screen {
            display: none;
            padding: 32px 24px;
            animation: fadeIn 0.3s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: #64748b;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Role Cards */
        .role-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 24px;
        }

        .role-card {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 24px;
            padding: 24px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .role-card.selected {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .role-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .role-title {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .role-desc {
            font-size: 14px;
            color: #64748b;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 16px;
            transition: all 0.2s;
            background: white;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Phone row with button */
        .phone-row, .verify-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .phone-row input, .verify-row input {
            flex: 2;
        }

        .phone-row button, .verify-row button {
            flex: 1;
            white-space: nowrap;
            background: #f1f5f9;
            color: #2563eb;
            border: 2px solid #e2e8f0;
            padding: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 16px;
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 12px;
        }

        .btn-primary:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #10b981;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            margin-bottom: 16px;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn span {
            font-size: 14px;
        }

        /* Progress dots */
        .progress {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 32px;
        }

        .progress-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #cbd5e1;
            transition: all 0.2s;
        }

        .progress-dot.active {
            width: 24px;
            border-radius: 4px;
            background: #2563eb;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            background: #1e293b;
            color: white;
            padding: 14px 20px;
            border-radius: 60px;
            font-size: 14px;
            text-align: center;
            z-index: 1000;
            display: none;
            max-width: 460px;
            margin: 0 auto;
        }

        .toast.success { background: #10b981; }
        .toast.error { background: #ef4444; }

        /* ==================== MAIN APP STYLES ==================== */
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header {
            padding: 20px 24px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }

        .header h1 {
            font-size: 24px;
        }

        .main-content {
            padding: 24px;
            flex: 1;
            overflow-y: auto;
        }

        .bottom-nav {
            display: flex;
            padding: 12px 20px;
            border-top: 1px solid #e5e7eb;
            background: white;
            gap: 20px;
        }

        .nav-item {
            flex: 1;
            text-align: center;
            padding: 8px;
            background: none;
            color: #6b7280;
            border: none;
            font-size: 12px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #2563eb;
        }

        .gig-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .gig-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .gig-meta {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .gig-desc {
            font-size: 14px;
            color: #4b5563;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-open { background: #dbeafe; color: #2563eb; }
        .badge-accepted { background: #d1fae5; color: #059669; }
        .badge-completed { background: #f3f4f6; color: #6b7280; }

        .wallet-card {
            background: linear-gradient(135deg, #1e3a5f, #0f172a);
            color: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .wallet-balance {
            font-size: 32px;
            font-weight: 700;
        }

        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 16px;
            background: #f9fafb;
            border-radius: 16px;
            margin-bottom: 16px;
        }

        .message {
            margin-bottom: 12px;
            max-width: 80%;
        }

        .message-sent {
            margin-left: auto;
            text-align: right;
        }

        .message-bubble {
            display: inline-block;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
        }

        .message-sent .message-bubble {
            background: #2563eb;
            color: white;
        }

        .message-received .message-bubble {
            background: white;
            border: 1px solid #e5e7eb;
            color: #333;
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
        }

        .chat-input-area button {
            width: auto;
            padding: 14px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="app-container" id="app">

    <!-- ==================== ONBOARDING ==================== -->
    <!-- Role Selection Screen -->
    <div id="role-screen" class="screen active">
        <div style="text-align: center; margin-top: 40px;">
            <div style="font-size: 56px; margin-bottom: 16px;">🔧</div>
            <h1>مرحباً بك</h1>
            <p class="subtitle">Choose how you want to use ServiceLink</p>
        </div>

        <div class="role-grid">
            <div class="role-card" data-role="household" onclick="selectRole('household')">
                <div class="role-icon">🏠</div>
                <div class="role-title">Household</div>
                <div class="role-desc">Post gigs and hire professionals بسهولة</div>
            </div>

            <div class="role-card" data-role="professional" onclick="selectRole('professional')">
                <div class="role-icon">🛠️</div>
                <div class="role-title">Professional</div>
                <div class="role-desc">Find work and get paid 💰</div>
            </div>
        </div>

        <button id="continue-btn" class="btn-primary" onclick="goToRegistration()" disabled>Continue</button>
    </div>

    <!-- Registration Screen -->
    <div id="registration-screen" class="screen">
        <button class="back-btn" onclick="goBackToRole()">← <span>Back</span></button>
        <div class="progress">
            <div class="progress-dot active"></div>
            <div class="progress-dot"></div>
            <div class="progress-dot"></div>
        </div>
        <h1>Create Account</h1>
        <p class="subtitle" id="registration-role-display">Registering as Household</p>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="full-name" placeholder="Ahmed Benali">
        </div>

        <div class="form-group">
            <label>ID Card Number</label>
            <input type="text" id="id-card" placeholder="AB123456">
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <div class="phone-row">
                <input type="tel" id="phone-number" placeholder="+212 6XX-XXXXXX">
                <button id="send-code-btn" onclick="sendVerificationCode()">Send Code</button>
            </div>
        </div>

        <div class="form-group" id="verification-group" style="display: none;">
            <label>Verification Code</label>
            <div class="verify-row">
                <input type="text" id="verification-code" placeholder="Enter 6-digit code" maxlength="6">
                <button id="verify-btn" onclick="verifyCode()">Verify</button>
            </div>
        </div>

        <div class="form-group" id="password-group" style="display: none;">
            <label>Password</label>
            <input type="password" id="password" placeholder="Create a strong password">
        </div>

        <div class="form-group" id="confirm-group" style="display: none;">
            <label>Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="Confirm your password">
        </div>

        <button id="create-account-btn" class="btn-primary" onclick="createAccount()" style="display: none;">Create Account</button>
    </div>

    <!-- ==================== MAIN APP SCREENS ==================== -->
    <!-- Household Main -->
    <div id="household-main" class="screen">
        <div class="header flex-between">
            <h1>My Gigs</h1>
            <button onclick="showPostGig()" style="background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 30px;">+ New</button>
        </div>
        <div class="main-content" id="household-gigs-list"></div>
        <div class="bottom-nav">
            <button class="nav-item active" onclick="switchHouseholdTab('gigs')">📋 My Gigs</button>
            <button class="nav-item" onclick="switchHouseholdTab('profile')">👤 Profile</button>
        </div>
    </div>

    <div id="post-gig-screen" class="screen">
        <div class="header">
            <button onclick="backToHousehold()" style="background: none; border: none; font-size: 24px;">←</button>
            <h1>Post New Gig</h1>
        </div>
        <div class="main-content">
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="gig-title" placeholder="e.g., Fix leaky faucet">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="gig-category">
                    <option>Plumbing</option>
                    <option>Electrical</option>
                    <option>Carpentry</option>
                    <option>Cleaning</option>
                    <option>Painting</option>
                </select>
            </div>
            <div class="form-group">
                <label>Urgency</label>
                <select id="gig-urgency">
                    <option value="normal">Normal</option>
                    <option value="urgent">Urgent (24h)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="gig-desc" rows="4" placeholder="Describe what needs to be done..."></textarea>
            </div>
            <button class="btn-primary" onclick="postGig()">Post Gig</button>
        </div>
    </div>

    <!-- Professional Main -->
    <div id="professional-main" class="screen">
        <div class="header">
            <h1>Find Work</h1>
        </div>
        <div class="main-content" id="pro-available-list"></div>
        <div class="bottom-nav">
            <button class="nav-item active" onclick="switchProTab('available')">🔍 Available</button>
            <button class="nav-item" onclick="switchProTab('active')">📋 My Gigs</button>
            <button class="nav-item" onclick="switchProTab('wallet')">💰 Wallet</button>
            <button class="nav-item" onclick="switchProTab('profile')">👤 Profile</button>
        </div>
    </div>

    <div id="pro-active-screen" class="screen">
        <div class="header"><h1>My Active Gigs</h1></div>
        <div class="main-content" id="pro-active-list"></div>
    </div>

    <div id="pro-wallet-screen" class="screen">
        <div class="header"><h1>My Wallet</h1></div>
        <div class="main-content">
            <div class="wallet-card">
                <div style="opacity: 0.8;">Available Balance</div>
                <div class="wallet-balance" id="wallet-balance">MAD 0</div>
            </div>
            <button class="btn-primary" onclick="fundWalletDemo()">Deposit MAD 100 (Demo)</button>
        </div>
    </div>

    <!-- Profile Screen -->
    <div id="profile-screen" class="screen">
        <div class="header"><h1>Profile</h1></div>
        <div class="main-content">
            <div style="text-align: center;">
                <div style="font-size: 64px;">👤</div>
                <h2 id="profile-name"></h2>
                <p id="profile-role" style="color: #6b7280;"></p>
                <p id="profile-phone" style="color: #6b7280;"></p>
            </div>
            <button class="btn-primary" onclick="logout()" style="background: #dc2626; margin-top: 24px;">Logout</button>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="screen">
        <div class="header flex-between">
            <button onclick="closeChat()" style="background: none; border: none; font-size: 24px;">←</button>
            <h1 id="chat-title">Chat</h1>
            <div></div>
        </div>
        <div class="main-content" style="display: flex; flex-direction: column; height: calc(100% - 80px);">
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

</div>

<div id="toast" class="toast"></div>

<script>
    // ==================== GLOBAL STATE ====================
    let currentUser = null;
    let selectedRole = null;
    let isPhoneVerified = false;
    let storedVerificationCode = null;
    let currentChatGig = null;
    let messageInterval = null;

    // ==================== UI Helpers ====================
    function showToast(msg, type = 'info') {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = `toast ${type === 'success' ? 'success' : (type === 'error' ? 'error' : '')}`;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // ==================== ONBOARDING ====================
    function selectRole(role) {
        selectedRole = role;
        document.querySelectorAll('.role-card').forEach(card => {
            card.classList.remove('selected');
            if (card.getAttribute('data-role') === role) card.classList.add('selected');
        });
        document.getElementById('continue-btn').disabled = false;
    }

    function goToRegistration() {
        if (!selectedRole) return;
        isPhoneVerified = false;
        document.getElementById('verification-group').style.display = 'none';
        document.getElementById('password-group').style.display = 'none';
        document.getElementById('confirm-group').style.display = 'none';
        document.getElementById('create-account-btn').style.display = 'none';
        document.getElementById('registration-role-display').innerHTML = selectedRole === 'household' ? '🏠 Registering as Household' : '🛠️ Registering as Professional';
        showScreen('registration-screen');
    }

    function goBackToRole() {
        showScreen('role-screen');
    }

    async function sendVerificationCode() {
        const phone = document.getElementById('phone-number').value.trim();
        if (!phone) { showToast('Enter phone number', 'error'); return; }
        const btn = document.getElementById('send-code-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Sending...';
        
        try {
            const response = await fetch('/api/send-code', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone })
            });
            const data = await response.json();
            if (data.success) {
                storedVerificationCode = data.testMode ? '123456' : null;
                showToast(data.testMode ? 'Test Mode: Code 123456' : 'Code sent!', 'success');
                document.getElementById('verification-group').style.display = 'block';
            } else {
                showToast('Failed to send code', 'error');
            }
        } catch (err) {
            // Demo fallback
            storedVerificationCode = '123456';
            showToast('Demo Mode: Use code 123456', 'success');
            document.getElementById('verification-group').style.display = 'block';
        }
        btn.disabled = false;
        btn.innerHTML = 'Send Code';
    }

    async function verifyCode() {
        const code = document.getElementById('verification-code').value.trim();
        if (!code) { showToast('Enter verification code', 'error'); return; }
        if (code === '123456' || code === storedVerificationCode) {
            isPhoneVerified = true;
            showToast('Phone verified!', 'success');
            document.getElementById('password-group').style.display = 'block';
            document.getElementById('confirm-group').style.display = 'block';
            document.getElementById('create-account-btn').style.display = 'block';
            document.getElementById('verify-btn').disabled = true;
            document.getElementById('verify-btn').innerHTML = 'Verified ✓';
        } else {
            showToast('Invalid code', 'error');
        }
    }

    async function createAccount() {
        const name = document.getElementById('full-name').value.trim();
        const idCard = document.getElementById('id-card').value.trim();
        const phone = document.getElementById('phone-number').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm-password').value;
        
        if (!name) { showToast('Enter full name', 'error'); return; }
        if (!idCard) { showToast('Enter ID card number', 'error'); return; }
        if (!isPhoneVerified) { showToast('Verify phone first', 'error'); return; }
        if (!password || password.length < 4) { showToast('Password must be at least 4 characters', 'error'); return; }
        if (password !== confirm) { showToast('Passwords do not match', 'error'); return; }
        
        const btn = document.getElementById('create-account-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Creating...';
        
        try {
            const response = await fetch('/api/verify-register', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, code: document.getElementById('verification-code').value, name, password, role: selectedRole })
            });
            const data = await response.json();
            if (data.success) {
                currentUser = data.user;
                localStorage.setItem('user', JSON.stringify(currentUser));
                localStorage.setItem('onboarded', 'true');
                showToast('Account created!', 'success');
                enterApp();
            } else {
                showToast(data.error || 'Registration failed', 'error');
            }
        } catch (err) {
            // Demo fallback
            currentUser = { id: 'user_' + Date.now(), name, phone, role: selectedRole, balance: 0 };
            localStorage.setItem('user', JSON.stringify(currentUser));
            localStorage.setItem('onboarded', 'true');
            showToast('Account created (Demo Mode)!', 'success');
            enterApp();
        }
        btn.disabled = false;
    }

    // ==================== MAIN APP ====================
    function enterApp() {
        if (currentUser.role === 'household') {
            showScreen('household-main');
            loadHouseholdGigs();
        } else {
            showScreen('professional-main');
            loadProAvailableGigs();
            loadProActiveGigs();
            loadWallet();
        }
        loadProfile();
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem('user');
        showScreen('role-screen');
        document.getElementById('continue-btn').disabled = true;
        selectedRole = null;
        document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
    }

    // Check saved session
    const savedUser = localStorage.getItem('user');
    const onboarded = localStorage.getItem('onboarded');
    if (savedUser && onboarded) {
        currentUser = JSON.parse(savedUser);
        enterApp();
    }

    // Household functions
    async function loadHouseholdGigs() {
        try {
            const res = await fetch('/api/gigs');
            const gigs = await res.json();
            const myGigs = gigs.filter(g => g.household_id === currentUser.id);
            const container = document.getElementById('household-gigs-list');
            if (myGigs.length === 0) { container.innerHTML = '<div style="text-align:center; padding:40px;">No gigs yet.</div>'; return; }
            container.innerHTML = myGigs.map(g => `
                <div class="gig-card">
                    <div class="flex-between"><div class="gig-title">${escapeHtml(g.title)}</div><span class="badge badge-${g.status || 'open'}">${g.status || 'open'}</span></div>
                    <div class="gig-meta">${escapeHtml(g.category)}</div>
                    <div class="gig-desc">${escapeHtml(g.description)}</div>
                    ${g.status === 'accepted' ? `<button class="btn-primary" style="margin-top:8px; background:#10b981;" onclick="markComplete('${g.id}')">✅ Mark Complete</button><button onclick="openChat('${g.id}', '${escapeHtml(g.title)}')" style="margin-top:8px;">💬 Chat</button>` : ''}
                </div>
            `).join('');
        } catch(e) { showToast('Error loading gigs'); }
    }

    function showPostGig() { showScreen('post-gig-screen'); }
    function backToHousehold() { showScreen('household-main'); loadHouseholdGigs(); }

    async function postGig() {
        const title = document.getElementById('gig-title').value.trim();
        const category = document.getElementById('gig-category').value;
        const urgency = document.getElementById('gig-urgency').value;
        const description = document.getElementById('gig-desc').value.trim();
        if (!title || !description) { showToast('Fill all fields', 'error'); return; }
        const newGig = { id: 'gig_' + Date.now(), title, category, urgency, description, household_id: currentUser.id, household_name: currentUser.name, created_at: Date.now() };
        try {
            await fetch('/api/gigs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newGig) });
            showToast('Gig posted!');
            backToHousehold();
        } catch(e) { showToast('Error posting gig'); }
    }

    // Professional functions
    async function loadProAvailableGigs() {
        try {
            const res = await fetch('/api/gigs');
            const gigs = await res.json();
            const available = gigs.filter(g => g.status === 'open' && g.household_id !== currentUser.id);
            const container = document.getElementById('pro-available-list');
            if (available.length === 0) { container.innerHTML = '<div style="text-align:center; padding:40px;">No gigs available</div>'; return; }
            container.innerHTML = available.map(g => `
                <div class="gig-card">
                    <div class="gig-title">${escapeHtml(g.title)}</div>
                    <div class="gig-meta">${escapeHtml(g.category)} • by ${escapeHtml(g.household_name)}</div>
                    <div class="gig-desc">${escapeHtml(g.description)}</div>
                    <button class="btn-primary" onclick="acceptGig('${g.id}')">Accept Gig</button>
                </div>
            `).join('');
        } catch(e) { showToast('Error loading gigs'); }
    }

    async function loadProActiveGigs() {
        try {
            const res = await fetch('/api/gigs');
            const gigs = await res.json();
            const active = gigs.filter(g => g.status === 'accepted' && g.professional_id === currentUser.id);
            const container = document.getElementById('pro-active-list');
            if (active.length === 0) { container.innerHTML = '<div style="text-align:center; padding:40px;">No active gigs</div>'; return; }
            container.innerHTML = active.map(g => `
                <div class="gig-card">
                    <div class="flex-between"><div class="gig-title">${escapeHtml(g.title)}</div><span class="badge badge-accepted">Active</span></div>
                    <div class="gig-meta">Client: ${escapeHtml(g.household_name)}</div>
                    <div class="gig-desc">${escapeHtml(g.description)}</div>
                    <button onclick="openChat('${g.id}', '${escapeHtml(g.title)}')" style="margin-bottom:8px;">💬 Chat</button>
                    <button class="btn-primary" style="background:#10b981;" onclick="markComplete('${g.id}')">✅ Mark Complete</button>
                </div>
            `).join('');
        } catch(e) { showToast('Error loading active gigs'); }
    }

    async function acceptGig(gigId) {
        try {
            const res = await fetch(`/api/gigs/${gigId}/accept`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ professional_id: currentUser.id, professional_name: currentUser.name }) });
            if (res.ok) { showToast('Gig accepted!'); loadProAvailableGigs(); loadProActiveGigs(); }
            else showToast('Failed', 'error');
        } catch(e) { showToast('Error', 'error'); }
    }

    async function markComplete(gigId) {
        try {
            await fetch(`/api/gigs/${gigId}/complete`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: currentUser.id }) });
            showToast('Marked complete!');
            if (currentUser.role === 'household') loadHouseholdGigs();
            else loadProActiveGigs();
        } catch(e) { showToast('Error'); }
    }

    async function fundWalletDemo() {
        try {
            await fetch('/api/wallet/fund', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: currentUser.id, amount: 100 }) });
            currentUser.balance = (currentUser.balance || 0) + 100;
            showToast('MAD 100 deposited!');
            loadWallet();
        } catch(e) { showToast('Error'); }
    }

    async function loadWallet() {
        try {
            const res = await fetch('/api/users?phone=' + encodeURIComponent(currentUser.phone));
            const user = await res.json();
            if (user) currentUser.balance = user.balance || 0;
            document.getElementById('wallet-balance').innerText = 'MAD ' + (currentUser.balance || 0);
        } catch(e) { document.getElementById('wallet-balance').innerText = 'MAD ' + (currentUser.balance || 0); }
    }

    function switchHouseholdTab(tab) { if (tab === 'gigs') showScreen('household-main'); else showScreen('profile-screen'); }
    function switchProTab(tab) {
        if (tab === 'available') showScreen('professional-main');
        else if (tab === 'active') showScreen('pro-active-screen');
        else if (tab === 'wallet') { showScreen('pro-wallet-screen'); loadWallet(); }
        else showScreen('profile-screen');
    }

    function loadProfile() {
        document.getElementById('profile-name').innerText = currentUser.name;
        document.getElementById('profile-role').innerText = currentUser.role === 'household' ? '🏠 Household' : '🛠️ Professional';
        document.getElementById('profile-phone').innerText = currentUser.phone;
    }

    // Chat functions
    async function openChat(gigId, title) {
        if (messageInterval) clearInterval(messageInterval);
        currentChatGig = { id: gigId, title };
        document.getElementById('chat-title').innerText = title;
        showScreen('chat-screen');
        await loadMessages();
        messageInterval = setInterval(loadMessages, 3000);
    }

    function closeChat() {
        if (messageInterval) clearInterval(messageInterval);
        messageInterval = null;
        if (currentUser.role === 'household') showScreen('household-main');
        else showScreen('professional-main');
    }

    async function loadMessages() {
        if (!currentChatGig) return;
        try {
            const res = await fetch(`/api/gigs/${currentChatGig.id}/messages`);
            const messages = await res.json();
            const container = document.getElementById('chat-messages');
            if (messages.length === 0) { container.innerHTML = '<div style="text-align:center; padding:40px;">No messages yet</div>'; return; }
            container.innerHTML = messages.map(msg => `
                <div class="message ${msg.sender_id === currentUser.id ? 'message-sent' : 'message-received'}">
                    <div class="message-bubble">
                        <div style="font-size:11px; opacity:0.7;">${escapeHtml(msg.sender_name)}</div>
                        <div>${escapeHtml(msg.text)}</div>
                        <div style="font-size:10px; opacity:0.5;">${new Date(msg.created_at).toLocaleTimeString()}</div>
                    </div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        } catch(e) { console.error(e); }
    }

    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text || !currentChatGig) return;
        try {
            await fetch(`/api/gigs/${currentChatGig.id}/messages`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender_id: currentUser.id, sender_name: currentUser.name, text })
            });
            input.value = '';
            await loadMessages();
        } catch(e) { showToast('Error sending message'); }
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
</script>
</body>
</html>
